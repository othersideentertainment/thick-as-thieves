r.UseClusteredDeferredShading=1

tick.AllowBatchedTicks=1

; Temporary test post-unreal-5.5
; Parallel rhi seems to cause the render thread to stall waiting on tasks that the render thread has spawned
; But does reduce occasional RHI spikes
r.RHICmd.ParallelTranslate.Enable=0

; Allow clients to async load dependencies in net messages rather than doing a blocking load
; Lyra has these on by default
net.AllowAsyncLoading=1
net.DelayUnmappedRPCs=1
net.AllowPIESeamlessTravel=1 ; not doing seamless travel at the moment, but differences in behavior has masked bugs in the past

; QA hit the limit once on a dedicated server, so might as well have this on
gc.DumpObjectCountsToLogWhenMaxObjectLimitExceeded=1

; Allow tooltips to show when using gamepad
Slate.AllowTooltipsWithHiddenCursor=True

; Disable caching of overlapping leaves (~0.2ms per tick on server)
p.Chaos.AccelerationStructureCacheOverlappingLeaves=0

; Limit scalability quality levels to Epic
sg.ViewDistanceQuality.NumLevels=4
sg.AntiAliasingQuality.NumLevels=4
sg.ShadowQuality.NumLevels=4
sg.GlobalIlluminationQuality.NumLevels=4
sg.ReflectionQuality.NumLevels=4
sg.PostProcessQuality.NumLevels=4
sg.TextureQuality.NumLevels=4
sg.EffectsQuality.NumLevels=4
sg.FoliageQuality.NumLevels=4
sg.ShadingQuality.NumLevels=4
sg.LandscapeQuality.NumLevels=4

